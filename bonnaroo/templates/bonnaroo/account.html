<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d; color: #fff;
      min-height: 100dvh; display: flex; flex-direction: column;
    }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: #1a1a1a; border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
    }
    .back-btn {
      background: transparent; border: 1px solid #333; color: #888;
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; font-size: 1rem; flex-shrink: 0;
    }
    header h1 {
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .content { flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; }

    /* Profile card */
    .profile-card {
      display: flex; align-items: center; gap: 16px;
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px;
      padding: 20px;
    }
    .profile-card img {
      width: 56px; height: 56px; border-radius: 50%; border: 2px solid #ff6b35; flex-shrink: 0;
    }
    .profile-initials {
      width: 56px; height: 56px; border-radius: 50%; background: #2a2a2a;
      border: 2px solid #ff6b35; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 700; color: #ff6b35; flex-shrink: 0;
    }
    .profile-info { flex: 1; overflow: hidden; }
    .profile-name { font-size: 1.05rem; font-weight: 600; color: #e0e0e0; }
    .profile-email { font-size: 0.78rem; color: #666; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Sections */
    .section { display: flex; flex-direction: column; gap: 8px; }
    .section-label {
      font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: #555; padding: 0 4px;
    }

    /* Name form */
    .name-form {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      overflow: hidden;
    }
    .name-input-row { display: flex; align-items: center; }
    .name-input-row input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e0e0e0; font-size: 0.9rem; padding: 14px 16px;
      font-family: inherit;
    }
    .name-input-row input::placeholder { color: #444; }
    .name-save-btn {
      background: transparent; border: none; border-left: 1px solid #2a2a2a;
      color: #ff6b35; font-size: 0.8rem; font-weight: 600;
      padding: 14px 16px; cursor: pointer; white-space: nowrap;
      font-family: inherit;
    }

    /* Action buttons */
    .action-btn {
      display: flex; align-items: center; gap: 12px;
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 15px 16px; cursor: pointer;
      text-decoration: none; width: 100%;
      font-family: inherit; font-size: 0.9rem;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .action-btn:active { background: #222; }

    @media (hover: hover) {
      .action-btn:hover { background: #1f1f1f; }
      .action-btn.danger:hover { background: #1f0a0a; }
      .back-btn:hover { border-color: #555; color: #aaa; }
      .name-save-btn:hover { color: #f7931e; }
    }
    @media (min-width: 640px) {
      .content { max-width: 520px; margin: 0 auto; }
    }
    .action-btn .btn-icon { font-size: 1.1rem; width: 20px; text-align: center; }
    .action-btn .btn-label { color: #ccc; }
    .action-btn.danger .btn-label { color: #f87171; }
    .action-btn.danger { border-color: #3a1f1f; }

    /* Confirm overlay */
    #confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #confirm-overlay.visible { opacity: 1; pointer-events: all; }
    .confirm-sheet {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
      padding: 24px 20px 36px; display: flex; flex-direction: column; gap: 12px;
    }
    .confirm-title { font-size: 1rem; font-weight: 600; color: #e0e0e0; }
    .confirm-body { font-size: 0.85rem; color: #888; line-height: 1.5; }
    .confirm-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .confirm-delete-btn {
      background: #7f1d1d; border: 1px solid #991b1b; color: #fca5a5;
      padding: 14px; border-radius: 12px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .confirm-cancel-btn {
      background: transparent; border: 1px solid #333; color: #888;
      padding: 14px; border-radius: 12px; font-size: 0.9rem;
      cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>

<header>
  <a href="{% url 'bonnaroo:map' %}" class="back-btn">‹</a>
  <h1>Account</h1>
</header>

<div class="content">

  <div class="profile-card">
    {% if photo %}
      <img src="{{ photo }}" alt="{{ name }}" />
    {% else %}
      <div class="profile-initials">{{ name|slice:":1"|upper }}</div>
    {% endif %}
    <div class="profile-info">
      <div class="profile-name">{{ name }}</div>
      <div class="profile-email">{{ email }}</div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Display name</div>
    <form class="name-form" method="post" action="{% url 'bonnaroo:update_name' %}">
      {% csrf_token %}
      <div class="name-input-row">
        <input type="text" name="name" value="{{ name }}" placeholder="Your name" maxlength="60" autocomplete="off" />
        <button type="submit" class="name-save-btn">Save</button>
      </div>
    </form>
  </div>

  <div class="section">
    <div class="section-label">Account</div>
    <a href="{% url 'bonnaroo:logout' %}" class="action-btn">
      <span class="btn-icon">↩</span>
      <span class="btn-label">Sign out</span>
    </a>
    <button class="action-btn danger" onclick="showConfirm()">
      <span class="btn-icon">🗑</span>
      <span class="btn-label">Delete account</span>
    </button>
  </div>

</div>

<div id="confirm-overlay" onclick="hideConfirm()">
  <div class="confirm-sheet" onclick="event.stopPropagation()">
    <div class="confirm-title">Delete account?</div>
    <div class="confirm-body">This permanently removes your account and location data. This cannot be undone.</div>
    <div class="confirm-actions">
      <form method="post" action="{% url 'bonnaroo:delete_account' %}">
        {% csrf_token %}
        <button type="submit" class="confirm-delete-btn" style="width:100%">Yes, delete my account</button>
      </form>
      <button class="confirm-cancel-btn" onclick="hideConfirm()">Cancel</button>
    </div>
  </div>
</div>

<script>
  function showConfirm() { document.getElementById('confirm-overlay').classList.add('visible'); }
  function hideConfirm() { document.getElementById('confirm-overlay').classList.remove('visible'); }
</script>
</body>
</html>
