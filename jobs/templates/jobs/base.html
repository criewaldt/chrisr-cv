<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Jobs{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d; color: #e8e8e8; min-height: 100vh;
      padding: 24px 20px 64px; line-height: 1.5;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    a { color: #4ecdc4; text-decoration: none; }
    a:hover { text-decoration: underline; }

    header.top { display: flex; align-items: baseline; justify-content: space-between;
                 flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
    h1 { font-size: 1.5rem; font-weight: 700;
         background: linear-gradient(135deg, #4ecdc4, #44bd9e);
         -webkit-background-clip: text; -webkit-text-fill-color: transparent;
         background-clip: text; }
    nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 22px; }
    nav.tabs a { padding: 6px 13px; border-radius: 8px; font-size: 0.85rem;
                 background: #161616; border: 1px solid #262626; color: #9a9a9a; }
    nav.tabs a.on { background: #143530; border-color: #22635a; color: #4ecdc4; }
    nav.tabs a:hover { text-decoration: none; border-color: #3a3a3a; }

    .banner { background: #161616; border: 1px solid #2a2a2a; border-left: 3px solid #4ecdc4;
              border-radius: 8px; padding: 11px 15px; margin-bottom: 18px; font-size: 0.85rem;
              color: #b5b5b5; }
    .banner.warn { border-left-color: #e0a458; }

    .card { background: #131313; border: 1px solid #242424; border-radius: 11px;
            padding: 14px 16px; margin-bottom: 9px; display: flex; gap: 15px;
            align-items: flex-start; transition: border-color .12s; }
    .card:hover { border-color: #3a3a3a; }
    .score { flex: 0 0 50px; text-align: center; }
    .score b { display: block; font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
    .score span { font-size: 0.6rem; text-transform: uppercase; letter-spacing: .06em;
                  color: #6a6a6a; }
    .s-hi b { color: #4ecdc4; } .s-mid b { color: #d8c26a; } .s-lo b { color: #7a7a7a; }
    .grow { flex: 1; min-width: 0; }
    .card h3 { font-size: 0.98rem; font-weight: 600; margin-bottom: 3px; }
    .card h3 a { color: #f0f0f0; }
    .meta { font-size: 0.8rem; color: #8a8a8a; display: flex; flex-wrap: wrap; gap: 9px; }
    .meta .sal { color: #4ecdc4; }
    .why { font-size: 0.82rem; color: #9e9e9e; margin-top: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .chip { font-size: 0.68rem; padding: 2px 7px; border-radius: 5px;
            background: #1b2b29; color: #6fb5ac; border: 1px solid #23413d; }
    .chip.miss { background: #2b1f1f; color: #b58080; border-color: #3d2626; }
    .tag { font-size: 0.64rem; text-transform: uppercase; letter-spacing: .05em;
           padding: 2px 6px; border-radius: 4px; background: #1e1e1e; color: #8a8a8a;
           border: 1px solid #2c2c2c; }
    .tag.est { background: #2a2416; color: #d0a94e; border-color: #3d3520; }

    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1f1f1f; }
    th { color: #7a7a7a; font-weight: 600; font-size: 0.72rem; text-transform: uppercase;
         letter-spacing: .05em; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: #6a6a6a; }
    .ok { color: #4ecdc4; } .bad { color: #d47f7f; }

    input[type=text], select {
      background: #161616; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 7px 11px; color: #e8e8e8; font-size: 0.85rem; font-family: inherit;
    }
    button, .btn {
      background: #1b3a35; border: 1px solid #2a5c54; color: #4ecdc4; cursor: pointer;
      border-radius: 8px; padding: 7px 13px; font-size: 0.82rem; font-family: inherit;
    }
    button:hover, .btn:hover { background: #204740; text-decoration: none; }
    .btn.ghost { background: #161616; border-color: #2a2a2a; color: #9a9a9a; }
    footer.note { margin-top: 30px; font-size: 0.78rem; color: #5a5a5a; }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>{% block heading %}Jobs{% endblock %}</h1>
    <div class="muted" style="font-size:.8rem">{% block subhead %}{% endblock %}</div>
  </header>
  <nav class="tabs">
    <a href="{% url 'jobs:inbox' %}" class="{% if tab == 'inbox' %}on{% endif %}">Inbox</a>
    <a href="{% url 'jobs:filtered' %}" class="{% if tab == 'filtered' %}on{% endif %}">Filtered out</a>
    <a href="{% url 'jobs:sources' %}" class="{% if tab == 'sources' %}on{% endif %}">Sources</a>
    <a href="/admin/jobs/searchprofile/" class="ghost">Settings</a>
  </nav>
  {% block content %}{% endblock %}
  <footer class="note">{% block foot %}{% endblock %}</footer>
</div>
</body>
</html>
